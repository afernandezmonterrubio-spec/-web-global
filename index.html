    <meta charset="UTF-8">

    <title>Global Motor Seguros | Ingeniería de Riesgos de Movilidad</title>

    <style>
        :root {
            --primary-navy: #0A1128;    
            --logo-blue: #0056B3;        
            --logo-blue-hover: #003D7A;   
            --neutral-slate: #475569;     
            --bg-light: #F8FAFC;         
            --white: #FFFFFF;
            --font-display: 'Space Grotesk', sans-serif;
            --font-body: 'DM Sans', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background-color: var(--bg-light);
            font-family: var(--font-body);
            color: var(--primary-navy);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 1140px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* --- CABECERA --- */
        header {
            background-color: var(--white);
            border-bottom: 1px solid #E2E8F0;
            padding: 22px 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .nav-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .brand-logo {
            display: flex;
            align-items: center;
            font-family: var(--font-display);
            font-weight: 700;
        }
        .brand-logo img {
            height: 50px;
            vertical-align: middle;
            margin-right: 14px;
        }
        .brand-logo span {
            color: var(--primary-navy);
            font-weight: 700;
            font-size: 20px;
            letter-spacing: 0.5px;
        }

        /* --- PORTADA --- */
        .hero {
            padding: 120px 0;
            background: linear-gradient(135deg, #FFFFFF 0%, #F1F5F9 100%);
            text-align: center;
        }
        .hero-content {
            max-width: 880px;
            margin: 0 auto;
        }
        .tag-specialist {
            display: inline-block;
            background-color: rgba(0, 86, 179, 0.07);
            color: var(--logo-blue);
            padding: 8px 18px;
            border-radius: 50px;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 28px;
        }
        .hero h1 {
            font-family: var(--font-display);
            font-size: 54px;
            line-height: 1.15;
            font-weight: 700;
            margin-bottom: 26px;
            color: var(--primary-navy);
            letter-spacing: -1px;
        }
        .hero h1 span {
            color: var(--logo-blue);
        }
        .hero p {
            font-size: 21px;
            color: var(--neutral-slate);
            margin-bottom: 44px;
            font-weight: 400;
        }
        
        .btn-call {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            padding: 22px 50px;
            background-color: var(--logo-blue);
            color: var(--white);
            border-radius: 8px;
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 18px;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 12px 24px rgba(0, 86, 179, 0.18);
        }
        .btn-call:hover {
            background-color: var(--logo-blue-hover);
            transform: translateY(-2px);
            box-shadow: 0 16px 32px rgba(0, 86, 179, 0.25);
        }

        /* --- SECCIÓN SOLUCIONES --- */
        .solutions {
            padding: 100px 0;
            background-color: var(--white);
        }
        .solutions-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 48px;
        }
        .sol-card {
            padding: 45px;
            border-radius: 16px;
            background-color: var(--bg-light);
            border: 1px solid #E2E8F0;
            transition: border-color 0.3s;
        }
        .sol-card:hover {
            border-color: #CBD5E1;
        }
        .sol-card i {
            font-size: 32px;
            color: var(--logo-blue);
            margin-bottom: 24px;
        }
        .sol-card h3 {
            font-family: var(--font-display);
            font-size: 24px;
            margin-bottom: 14px;
            font-weight: 700;
        }
        .sol-card p {
            color: var(--neutral-slate);
            font-size: 16px;
            line-height: 1.6;
        }

        /* --- TABLA --- */
        .comparison { padding: 100px 0; background-color: var(--bg-light); }
        .comparison h2 { font-family: var(--font-display); font-size: 38px; text-align: center; margin-bottom: 54px; font-weight: 700; letter-spacing: -0.5px; }
        table { width: 100%; border-collapse: collapse; font-size: 16px; background-color: var(--white); border-radius: 16px; overflow: hidden; box-shadow: 0 4px 20px rgba(10, 10, 10, 0.1); }
    </style>
